# PUFFY — runtime parameters (from koral_lite/PROBLEMS/PUFFY/define.h)

problem = "puffy"   # the executable this file is for (checked by the driver)

[physical]
mass = 10.0        # MASS (solar masses)
bhspin = 0.0       # BHSPIN — Schwarzschild
gam = 1.6666666666666667   # GAMMA 5/3

[grid]
nx = 384           # TNX (radial)
ny = 360           # TNY (theta)
nz = 1             # TNZ — azimuthal resolution. 1 = 2D axisymmetric (validated).
                   # nz>1 subdivides the fixed PHIWEDGE=π/2 wedge for a 3D run
                   # (M14). rmin/rmax/mksr0/mksh0 ARE read (0 / omitted = auto).
                   # miny..maxz are unused — makeGridNz hardcodes MINY=0.001,
                   # MAXY=1-0.001, ±PHIWEDGE/2.
rmin = 1.85        # RMIN  (0 = rminForSpin(bhspin); >0 = explicit)
rmax = 500.0       # RMAX  (0 = keep 500 M; >0 = explicit)
mksr0 = 0.1        # MKSR0 (optional override of Physics.mp.mksr0)
mksh0 = 0.9        # MKSH0 (optional override of Physics.mp.mksh0)
miny = 0.001       # MINY            (not read — problem constant)
maxy = 0.999       # MAXY = 1-0.001  (not read — problem constant)
minz = -0.7853981633974483   # -PHIWEDGE/2  (not read — problem constant)
maxz = 0.7853981633974483    # +PHIWEDGE/2  (not read — problem constant)

[run]
tstart = 0.0
tmax = 10000.0     # run duration in GM/c^3 (reduce for a quick test)
nstep_max = 100  # hard cap on steps
tsteplim = 0.5     # TSTEPLIM (CFL factor)
dtout1 = 100.0     # output cadence (code time): scalars + KDMP checkpoint + silo
dtout2 = 500.0     # (reserved: C's avg-file cadence; a KDMP restart checkpoint
                   #  is now written on every output frame, so a run started here
                   #  is always resumable via `puffy <toml> --restart dumps/puffy`)
out_dir = "dumps/puffy"
nthreads = 12       # persistent worker team for all per-step passes (1 = serial)

[floors]
rhofloor = 1e-30
uurhoratiomin = 1e-8
uurhoratiomax = 1.0
eerhoratiomin = 1e-20
eerhoratiomax = 1e4
b2rhoratiomax = 50.0
b2uuratiomax = 50.0
gammamaxhd = 10.0
gammamaxrad = 10.0
